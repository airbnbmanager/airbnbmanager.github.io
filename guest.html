<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow"/>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Digital Stay Pass — Unique Haven Homes</title>
  <meta name="description" content="Your digital guest pass for Unique Haven Homes. Access WiFi, Google Maps navigation, house rules, and 1-tap concierge.">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #FF385C;
      --primary-dark: #E00B41;
      --gold: #F59E0B;
      --emerald: #10B981;
      --bg-dark: #0F172A;
      --surface: #1E293B;
      --surface-elevated: #334155;
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --border-glass: rgba(255, 255, 255, 0.12);
      --glass-bg: rgba(30, 41, 59, 0.75);
      --radius-lg: 20px;
      --radius-md: 14px;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 56, 92, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
      font-family: var(--font-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 60px;
    }

    .pass-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Brand Bar */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px;
    }
    .brand-logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #FF385C, #E00B41);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 14px rgba(255, 56, 92, 0.4);
    }
    .brand-name {
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
    }
    .status-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.15);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34D399;
      animation: pulseAnim 1.8s infinite;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.4); }
    }

    /* Card styling with glassmorphism */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    /* Stay Hero Ticket */
    .hero-ticket {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    }
    .ticket-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #FBBF24;
      background: rgba(245, 158, 11, 0.12);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .property-title {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .unit-tag {
      font-size: 14px;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 18px;
    }
    .ticket-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: rgba(0, 0, 0, 0.25);
      padding: 14px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .ticket-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .ticket-val {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    .ticket-time {
      font-size: 11px;
      color: #FBBF24;
      font-weight: 600;
      margin-top: 2px;
    }

    /* WiFi Card */
    .wifi-card {
      border-left: 4px solid #38BDF8;
    }
    .card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .card-heading {
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .wifi-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .wifi-info-label {
      font-size: 11px;
      color: var(--text-sub);
    }
    .wifi-val {
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .copy-btn {
      background: #38BDF8;
      color: #0F172A;
      border: none;
      font-weight: 700;
      font-size: 12.5px;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .copy-btn:active {
      transform: scale(0.94);
    }
    .copy-btn.copied {
      background: #10B981;
      color: #fff;
    }

    /* Action Grid (WhatsApp Concierge) */
    .concierge-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .concierge-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      padding: 12px;
      color: #fff;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .concierge-btn:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.1);
    }
    .concierge-icon {
      font-size: 22px;
    }
    .concierge-text {
      font-size: 13px;
      font-weight: 600;
    }
    .concierge-sub {
      font-size: 10.5px;
      color: var(--text-sub);
    }

    /* ID Upload Box & Multi-Photo Grid */
    .upload-box {
      border: 2px dashed rgba(255, 255, 255, 0.25);
      border-radius: var(--radius-md);
      padding: 18px;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      display: block;
      transition: all 0.2s ease;
    }
    .upload-box:hover {
      border-color: #38BDF8;
      background: rgba(255, 255, 255, 0.06);
    }
    .upload-box:active {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--primary);
    }

    .upload-preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .upload-preview-item {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16/11;
      background: #0F172A;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .upload-preview-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      border-color: #38BDF8;
    }
    .upload-preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .upload-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }
    .upload-delete-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(239, 68, 68, 0.95);
      color: #fff;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      transition: all 0.15s ease;
      z-index: 10;
    }
    .upload-delete-btn:hover {
      background: #DC2626;
      transform: scale(1.15);
    }
    .upload-delete-btn:active {
      transform: scale(0.9);
    }

    /* ─── FULLSCREEN LIGHTBOX MODAL ─── */
    .guest-lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 2147483647 !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeInLightbox 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeInLightbox {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
    .guest-lightbox-img {
      max-width: 95%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #000;
    }
    .guest-lightbox-close {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .guest-lightbox-close:hover {
      background: rgba(255, 255, 255, 0.45);
    }
    .guest-lightbox-footer {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .guest-lightbox-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Full Width Action Button */
    .action-btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .action-btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 4px 18px rgba(255, 56, 92, 0.35);
    }
    .action-btn.maps {
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      box-shadow: 0 4px 18px rgba(37, 99, 235, 0.35);
    }
    .action-btn:active {
      transform: scale(0.97);
    }

    /* Rules accordion */
    .rule-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 13px;
      color: var(--text-sub);
    }
    .rule-item:last-child { border-bottom: none; }
    .rule-item strong { color: #fff; }

    /* Footer */
    .pass-footer {
      text-align: center;
      margin-top: 10px;
      font-size: 11.5px;
      color: var(--text-sub);
    }
    .pass-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }

    /* Loading Spinner */
    .loader-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 56, 92, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Tax Receipt Modal & Screen Overlay */
    .tax-receipt-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }
    .receipt-print-container {
      background: #ffffff;
      color: #0f172a;
      border-radius: 16px;
      max-width: 620px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      font-family: var(--font-body);
      max-height: 90vh;
      overflow-y: auto;
    }
    .receipt-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 16px;
    }
    .receipt-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .receipt-btn.print-btn {
      background: #2563EB;
      color: #fff;
    }
    .receipt-btn.close-btn {
      background: #E2E8F0;
      color: #334155;
    }

    /* Portal Search Screen & Multiple Bookings List */
    .booking-list-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .booking-list-item:hover {
      border-color: rgba(255, 56, 92, 0.4);
      background: rgba(255, 255, 255, 0.08);
    }
    .booking-list-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Print Styles for Official Tax Invoice & Stay Receipt */
    @media print {
      body { background: #fff !important; color: #000 !important; padding: 0 !important; }
      body * { visibility: hidden !important; }
      #taxReceiptModalOverlay, #taxReceiptModalOverlay * { visibility: visible !important; }
      #taxReceiptModalOverlay {
        position: absolute !important; left: 0 !important; top: 0 !important;
        width: 100% !important; background: #fff !important; padding: 0 !important;
      }
      .receipt-print-container {
        box-shadow: none !important; border: none !important; padding: 20px !important;
      }
      .no-print { display: none !important; }
    }
  </style>
  <script src="js/sms-service.js?v=281"></script>
</head>
<body>

  <div class="pass-container" id="passRoot">
    <!-- Loading Screen -->
    <div class="loader-wrap" id="loadingState">
      <div class="spinner"></div>
      <div style="font-weight:600;font-size:15px;color:#fff;">Loading Your Stay Pass...</div>
      <div style="font-size:12px;color:var(--text-sub);">Unique Haven Homes & Villas</div>
    </div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    let _activeSbClient = null;
    let _activeBookingId = null;
    let _activeIdPhotos = [];
    let _currentStayBk = null;
    let _currentStayRoom = null;

    const SAFE_FIELDS = `
      booking_id, guest_name, phone, check_in, check_out, check_in_time, check_out_time,
      guests, total_amount, per_day_rate, payment_status, notes,
      id_proof_photo_path, id_proof_front_paths, id_proof_back_paths, id_proof_photo_paths,
      rooms(nickname, property_name, unit_no, wifi_ssid, wifi_password, map_link, address, city)
    `.replace(/\s+/g, ' ').trim();

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function fmtDate(dStr) {
      try {
        return new Date(dStr + 'T12:00:00').toLocaleDateString('en-IN', {
          weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
        });
      } catch (e) { return dStr || ''; }
    }

    function extractGuestLocation(bk) {
      let city = 'Lucknow';
      let country = 'India';
      if (bk && bk.notes) {
        const cMatch = bk.notes.match(/City:\s*([^|\n]+)/i);
        const coMatch = bk.notes.match(/Country:\s*([^|\n]+)/i);
        if (cMatch && cMatch[1].trim()) city = cMatch[1].trim();
        if (coMatch && coMatch[1].trim()) country = coMatch[1].trim();
      }
      return { city, country };
    }

    function getSb() {
      if (_activeSbClient) return _activeSbClient;
      try {
        if (window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
          _activeSbClient = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
        }
      } catch (e) {
        console.warn('Supabase init error:', e);
      }
      return _activeSbClient;
    }

    // ─── MAIN INIT ───
    async function initGuestPass() {
      const params = new URLSearchParams(window.location.search);
      const bId = (params.get('id') || params.get('b') || params.get('booking_id') || '').trim();
      const phoneParam = (params.get('phone') || params.get('m') || '').trim();

      getSb();

      if (bId) {
        await loadBookingById(bId);
      } else if (phoneParam && window.TuhhSmsService && window.TuhhSmsService.isPhoneVerified(phoneParam)) {
        await loadBookingsByPhone(phoneParam);
      } else {
        renderPortalSearchScreen();
      }
    }

    // ─── SEARCH SCREEN ───
    function renderPortalSearchScreen(statusMsg = '', isError = false) {
    window.renderPortalSearchScreen = renderPortalSearchScreen;
      const root = document.getElementById('passRoot');
      if (!root) return;

      root.innerHTML = `
        <!-- Brand Header -->
        <header class="brand-header">
          <div class="brand-logo-wrap">
            <img src="assets/logo-emblem.png" alt="Logo" class="brand-icon" style="width:38px;height:38px;border-radius:10px;object-fit:cover;border:1.5px solid rgba(245,158,11,0.5);box-shadow:0 0 12px rgba(245,158,11,0.3);" />
            <div>
              <div class="brand-name">THE UNIQUE HAVEN HOMES</div>
              <div class="brand-sub">GUEST SELF-SERVICE PORTAL</div>
            </div>
          </div>
          <div class="status-pill">
            <span class="pulse-dot"></span> Secure Portal
          </div>
        </header>

        <!-- Search Card -->
        <div class="glass-card" style="border:1px solid rgba(255,255,255,0.18);">
          <div style="text-align:center;margin-bottom:18px;">
            <div style="font-size:32px;margin-bottom:8px;">🔍</div>
            <h1 style="font-size:20px;font-weight:800;font-family:var(--font-heading);color:#fff;">
              Find Your Stay &amp; Tax Receipt
            </h1>
            <p style="font-size:12.5px;color:var(--text-sub);margin-top:6px;line-height:1.5;">
              Enter your registered <strong>10-digit Mobile Number</strong> or <strong>Booking ID</strong> to access your Digital Stay Pass, WiFi credentials, Google Maps navigation, and official Tax Invoice.
            </p>
          </div>

          <div style="display:flex;flex-direction:column;gap:12px;">
            <div>
              <label for="portalSearchInput" style="font-size:12px;font-weight:700;color:#CBD5E1;display:block;margin-bottom:6px;">
                Mobile Number or Booking ID
              </label>
              <input
                type="text"
                id="portalSearchInput"

    // ─── EXECUTE PORTAL SEARCH ───
    async function doPortalSearch() {
    window.doPortalSearch = doPortalSearch;
      const inp = document.getElementById('portalSearchInput');
      const feedback = document.getElementById('portalSearchFeedback');
      if (!inp) return;

      const val = inp.value.trim();
      if (!val) {
        showPortalError('Please enter your 10-digit mobile number or Booking ID.');
        inp.focus();
        return;
      }

      const digitsOnly = val.replace(/\D/g, '');
      const isPhone = digitsOnly.length === 10 || (digitsOnly.length === 12 && digitsOnly.startsWith('91'));

      if (isPhone) {
        const clean10 = digitsOnly.slice(-10);
        if (window.TuhhSmsService && window.TuhhSmsService.isPhoneVerified(clean10)) {
          await loadBookingsByPhone(clean10);
        } else if (window.TuhhSmsService) {
          window.TuhhSmsService.showOtpModal(clean10, 'Guest', async (verified) => {
            if (verified) {
              await loadBookingsByPhone(clean10);
            }
          });
        } else {
          await loadBookingsByPhone(clean10);
        }
      } else {
        await loadBookingById(val);
      }
    };

    function showPortalError(msg) {
      const feedback = document.getElementById('portalSearchFeedback');
      if (feedback) {
        feedback.style.display = 'block';
        feedback.style.background = 'rgba(239,68,68,0.15)';
        feedback.style.color = '#FCA5A5';
        feedback.style.border = '1px solid rgba(239,68,68,0.3)';
        feedback.innerHTML = '⚠️ ' + escapeHtml(msg);
      }
    }

    // ─── LOAD BOOKING BY ID ───

    window.loadBookingById = loadBookingById;
      const root = document.getElementById('passRoot');
      if (root) {
        root.innerHTML = `
          <div class="loader-wrap">
            <div class="spinner"></div>
            <div style="font-weight:600;font-size:15px;color:#fff;">Looking up Reservation #${escapeHtml(bookingId)}...</div>
            <div style="font-size:12px;color:var(--text-sub);">Unique Haven Homes & Villas</div>
          </div>
        `;
      }

      const sb = getSb();
      let bk = null;

      if (sb) {
        try {
          const { data, error } = await sb
            .from('guest_register')
            .select(SAFE_FIELDS)
            .ilike('booking_id', bookingId)
            .maybeSingle();

          if (data && !error) bk = data;
        } catch (e) {
          console.warn('loadBookingById error:', e);
        }
      }

      if (!bk) {
        renderPortalSearchScreen(`No reservation found matching Booking ID "${escapeHtml(bookingId)}". Please double-check the ID or search using your 10-digit mobile number.`, true);
        return;
      }

      renderStayPassTicket(bk, bk.rooms);

    // Copy Helper

        const orig = btn.textContent;
        btn.textContent = '✓ Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = orig;
          btn.classList.remove('copied');

    // Render All Attached ID Proofs
    async function renderIdGallery() {
      const grid = document.getElementById('idPreviewGrid');
      const badge = document.getElementById('idStatusBadge');
      if (!grid) return;
      grid.innerHTML = '';

      if (badge) {
        if (_activeIdPhotos.length > 0) {
          badge.style.background = '#065F46';
          badge.style.color = '#34D399';
          badge.textContent = `✅ ${_activeIdPhotos.length} ID(s) Attached`;
        } else {
          badge.style.background = '#7C2D12';
          badge.style.color = '#FCA5A5';
          badge.textContent = '⚠️ Pending';
        }
      }

      if (_activeIdPhotos.length === 0) return;

      for (let idx = 0; idx < _activeIdPhotos.length; idx++) {
        const path = _activeIdPhotos[idx];
        let imgUrl = path;

        // Fetch signed url if stored in Supabase
        if (_activeSbClient && !path.startsWith('blob:') && !path.startsWith('data:')) {
          try {
            const { data } = await _activeSbClient.storage.from('id-proofs').createSignedUrl(path, 3600);
            if (data?.signedUrl) imgUrl = data.signedUrl;
          } catch(e) {}
        }

        const item = document.createElement('div');
        item.className = 'upload-preview-item';
        item.innerHTML = `
          <img src="${imgUrl}" alt="ID Photo" onclick="openGuestLightbox('${imgUrl}', 'ID #${idx + 1}')" />
          <span class="upload-badge">ID #${idx + 1}</span>
          <button type="button" class="upload-delete-btn" title="Delete this photo" onclick="event.stopPropagation(); deleteGuestIdPhoto('${path}', this)">
            ✕
          </button>
        `;
        grid.appendChild(item);
      }
    }

    // ─── FULLSCREEN LIGHTBOX PREVIEW ───
    window.openGuestLightbox = function(url, title = 'ID Photo') {
      document.querySelectorAll('.guest-lightbox-overlay').forEach(el => el.remove());

      const overlay = document.createElement('div');
      overlay.className = 'guest-lightbox-overlay';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

      const escClose = (e) => {
        if (e.key === 'Escape') {
          overlay.remove();
          window.removeEventListener('keydown', escClose);
        }
      };
      window.addEventListener('keydown', escClose);

      overlay.innerHTML = `
        <button class="guest-lightbox-close" onclick="this.closest('.guest-lightbox-overlay').remove()">✕</button>
        <img class="guest-lightbox-img" src="${url}" alt="ID Full Photo" />
        <div class="guest-lightbox-footer">
          <a href="${url}" target="_blank" download="${title}.jpg" class="guest-lightbox-btn">
            <span>📥</span> Download Full Size
          </a>
          <button type="button" class="guest-lightbox-btn" onclick="this.closest('.guest-lightbox-overlay').remove()">
            <span>✕</span> Close
          </button>
        </div>
      `;

      document.body.appendChild(overlay);
    };

    // ─── DELETE SPECIFIC ID PHOTO ───
    window.deleteGuestIdPhoto = async function(pathToDelete, btn) {
      if (!confirm('Are you sure you want to delete this photo? You can upload a new one.')) return;

      btn.disabled = true;
      btn.textContent = '...';
      const feedback = document.getElementById('uploadFeedback');
      if (feedback) {
        feedback.style.display = 'block';
        feedback.style.color = '#F59E0B';
        feedback.textContent = 'Deleting photo...';
      }

      // Remove from storage
      if (_activeSbClient && !pathToDelete.startsWith('blob:') && !pathToDelete.startsWith('data:')) {
        try {
          await _activeSbClient.storage.from('id-proofs').remove([pathToDelete]);
        } catch(e) {
          console.warn('Storage delete warning:', e);
        }
      }

      // Update state
      _activeIdPhotos = _activeIdPhotos.filter(p => p !== pathToDelete);

      // Update DB record
      if (_activeSbClient && _activeBookingId) {
        try {
          await _activeSbClient.from('guest_register').update({
            id_proof_photo_paths: _activeIdPhotos.join(',') || null,
            id_proof_front_paths: _activeIdPhotos[0] || null,
            id_proof_back_paths: _activeIdPhotos[1] || null,
            id_proof_photo_path: _activeIdPhotos[0] || null
          }).eq('booking_id', _activeBookingId);
        } catch(e) {
          console.warn('DB update error:', e);
        }
      }

      if (feedback) {
        feedback.style.color = '#10B981';
        feedback.textContent = '✓ Photo deleted successfully!';
        setTimeout(() => feedback.style.display = 'none', 2500);
      }

      renderIdGallery();
    };

    // ─── UPLOAD MULTIPLE IDS WITH COMPRESSION ───
    window.handleGuestIdUpload = async function(input) {
      const files = Array.from(input.files || []);
      if (!files.length) return;

      const feedback = document.getElementById('uploadFeedback');
      feedback.style.display = 'block';
      feedback.style.color = '#38BDF8';
      feedback.textContent = `Uploading ${files.length} photo(s) securely...`;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        feedback.textContent = `Uploading photo ${i + 1} of ${files.length}...`;

        if (_activeSbClient && _activeBookingId) {
          try {
            const ext = file.name.split('.').pop() || 'jpg';
            const storagePath = `guest-passes/${_activeBookingId}-${Date.now()}-${i}.${ext}`;
            const { error: upErr } = await _activeSbClient.storage.from('id-proofs').upload(storagePath, file, { upsert: true });
            if (!upErr) {
              _activeIdPhotos.push(storagePath);
            }
          } catch(err) {
            console.warn('Storage upload error:', err);
          }
        } else {
          // Offline preview fallback
          _activeIdPhotos.push(URL.createObjectURL(file));
        }
      }

      // Update database with combined unique photos
      if (_activeSbClient && _activeBookingId && _activeIdPhotos.length) {
        try {
          await _activeSbClient.from('guest_register').update({
            id_proof_photo_paths: _activeIdPhotos.join(','),
            id_proof_front_paths: _activeIdPhotos[0] || null,
            id_proof_back_paths: _activeIdPhotos[1] || null,
            id_proof_photo_path: _activeIdPhotos[0] || null,
            id_proof_type: 'Aadhaar Card'
          }).eq('booking_id', _activeBookingId);
        } catch (e) { console.warn('DB update error:', e); }
      }

      feedback.style.color = '#34D399';
      feedback.textContent = `✅ Successfully uploaded ${files.length} photo(s)! Tap any photo to view full size.`;
      setTimeout(() => feedback.style.display = 'none', 4000);

      input.value = '';
      renderIdGallery();
    };
  </script>
