name: Keep WhatsApp Bot Alive

on:
  schedule:
    # Ping every 10 minutes to prevent Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render WhatsApp Gateway
        run: |
          curl -s -m 30 "https://uhhs-whatsapp-bot.onrender.com/health" || echo "Ping attempted"
