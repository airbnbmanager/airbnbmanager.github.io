name: 🎬 The Unique Haven Homes - Daily Instagram Reels Automation

on:
  schedule:
    # 04:00 UTC = 09:30 AM IST (Morning Aesthetic Reel)
    - cron: '0 4 * * *'
    # 08:30 UTC = 02:00 PM IST (Afternoon Showcase Reel)
    - cron: '30 8 * * *'
    # 14:00 UTC = 07:30 PM IST (Evening Peak Traffic Reel)
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      property_code:
        description: 'Specific Property Code (leave empty for auto-rotation)'
        required: false
        default: ''

jobs:
  generate-and-publish-reel:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🎬 Install FFmpeg & Chromium Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser

      - name: 🏨 Generate 100% Property Specific Reel
        env:
          INSTAGRAM_PAGE_ID: ${{ secrets.INSTAGRAM_PAGE_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CHROME_PATH: /usr/bin/chromium-browser
        run: |
          if [ -n "${{ github.event.inputs.property_code }}" ]; then
            node scripts/instagram-automation/generate-property-reel.js "${{ github.event.inputs.property_code }}"
          else
            node scripts/instagram-automation/post-to-instagram.js
          fi

      - name: 💾 Commit Updated Rotation State & Reels
        run: |
          git config user.name "The Unique Haven Bot"
          git config user.email "bot@uniquehavenhomesstay.com"
          git add scripts/instagram-automation/rotation-state.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(instagram): record daily reel rotation log [skip ci]"
          git push origin main || true
