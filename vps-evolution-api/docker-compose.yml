version: '3.8'

services:
  evolution-api:
    image: atendai/evolution-api:v2.2.2
    container_name: tuhh-evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=tuhh_secure_evo_key_2026
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://postgres:tuhh_postgres_pass@postgres:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - DEL_INSTANCE=false
      - WEBHOOK_GLOBAL_ENABLED=false
      - SENTRY_ENABLED=false
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK
      - LOG_COLOR=true
      - QRCODE_LIMIT=30
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis
    networks:
      - evolution-net

  postgres:
    image: postgres:15-alpine
    container_name: tuhh-evolution-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=tuhh_postgres_pass
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-net

  redis:
    image: redis:7-alpine
    container_name: tuhh-evolution-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - evolution-net

volumes:
  evolution_instances:
  postgres_data:
  redis_data:

networks:
  evolution-net:
    driver: bridge
