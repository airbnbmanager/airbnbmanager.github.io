  <!-- 📱 PWA Service Worker & Realtime Offline Sync -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=231').then(reg => {
          console.log('✅ UHHS PWA Service Worker active:', reg.scope);
          // Check for SW updates
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          reg.onupdatefound = () => {
            const installing = reg.installing;
            if (installing) {
              installing.onstatechange = () => {
                if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('🔄 New PWA update available, activating latest version');
                  window.location.reload();
                }
              };
            }
          };
        }).catch(err => {
          console.warn('SW registration notice:', err.message);
        });
      });
    }

    // Clean up stale dry-run localStorage keys
    ['uhhs_wa_automation_v1', 'uhhs_wa_automation_v2', 'uhhs_wa_automation_v3', 'uhhs_wa_automation_v4'].forEach(k => {
      try { localStorage.removeItem(k); } catch(e) {}
    });
  </script>

  <!-- PWA Install Banner (Dismissible & Non-blocking) -->
  <div id="pwa-install-bar" style="display:none;position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:99999;background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%);color:white;padding:7px 12px 7px 16px;border-radius:999px;font-size:12.5px;font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,0.35);align-items:center;gap:10px;font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:0.3px;border:1px solid rgba(255,255,255,0.18);white-space:nowrap;max-width:92vw;">
    <span id="pwa-install-trigger" style="cursor:pointer;display:flex;align-items:center;gap:6px;">
      <span>📲</span> <span>Install UHHS App</span>
    </span>
    <button type="button" id="pwa-dismiss-btn" aria-label="Dismiss" style="background:rgba(255,255,255,0.18);border:none;color:#fff;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0;transition:background 0.2s;">✕</button>
  </div>

  <script>
    let deferredPrompt;

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Do not display if user has already dismissed or is running in standalone PWA mode
      if (localStorage.getItem('uhhs_pwa_dismissed') === '1') return;
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) return;
      const bar = document.getElementById("pwa-install-bar");
      if (bar) bar.style.display = "inline-flex";
    });

    document.getElementById("pwa-install-trigger")?.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById("pwa-install-bar").style.display = "none";
    });

    document.getElementById("pwa-dismiss-btn")?.addEventListener("click", (e) => {
      e.stopPropagation();
      localStorage.setItem('uhhs_pwa_dismissed', '1');
      const bar = document.getElementById("pwa-install-bar");
      if (bar) bar.style.display = "none";
    });

    window.addEventListener("appinstalled", () => {
      localStorage.setItem('uhhs_pwa_dismissed', '1');
      document.getElementById("pwa-install-bar").style.display = "none";
    });
  </script>
