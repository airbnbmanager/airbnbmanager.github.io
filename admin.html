  <!-- Automatic Cache & SW Cleaner (Guarantees Realtime Admin Code) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (let r of regs) {
          r.unregister();
          console.log('🧹 Stale SW unregistered');
        }
      });
      if (window.caches) {
        caches.keys().then(keys => {
          for (let k of keys) caches.delete(k);
        });
      }
    }
    // Clean up stale dry-run localStorage keys
    ['uhhs_wa_automation_v1', 'uhhs_wa_automation_v2', 'uhhs_wa_automation_v3', 'uhhs_wa_automation_v4'].forEach(k => {
      try { localStorage.removeItem(k); } catch(e) {}
    });
  </script>
  <!-- PWA Install Button -->
  <div id="pwa-install-bar" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99999;background:#6C5CE0;color:white;padding:14px 28px;border-radius:50px;font-size:15px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,0.3);cursor:pointer;align-items:center;gap:10px;font-family:sans-serif;">
    📲 Install App
  </div>

  <script>
    let deferredPrompt;

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById("pwa-install-bar");
      btn.style.display = "flex";
      console.log("✅ Install prompt ready");
    });

    document.getElementById("pwa-install-bar").addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log("User choice:", outcome);
      deferredPrompt = null;
      document.getElementById("pwa-install-bar").style.display = "none";
    });

    window.addEventListener("appinstalled", () => {
      console.log("✅ PWA Installed!");
      document.getElementById("pwa-install-bar").style.display = "none";
    });
  </script>
