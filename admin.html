<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The UNIQUE HAVEN HOME STAY</title>
  <link rel="icon" type="image/png" href="assets/logo.png?v=2" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#221F3D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Unique Haven" />
  <link rel="apple-touch-icon" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 🎯 Splash Screen -->
  <div id="splashScreen">
    <div class="splash-logo">
      <img src="assets/logo.png" alt="Unique Haven" />
    </div>
    <div class="splash-title">Unique Haven</div>
    <div class="splash-tagline">Lucknow • Home Stay</div>
    <div class="splash-spinner"></div>
  </div>

  <div id="app"></div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Config -->
  <script src="config.js"></script>

  <!-- App Modules — order matters -->
  <script src="js/core.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/daily-report.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/bookings.js"></script>
  <script src="js/per-day-calc.js"></script>
  <script src="js/properties.js"></script>
  <script src="js/employees.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/store.js"></script>
  <script src="js/maintenance.js"></script>
  <script src="js/investors.js"></script>
  <script src="js/sop.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/reconciliation.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/airbnb-sync.js"></script>
  <script src="js/ical-sync.js"></script>
  <script src="js/laundry.js"></script>
  <script src="js/reimbursements.js"></script>
  <script src="js/property-setup.js"></script>
  <script src="js/company-advances.js"></script>
  <script src="js/cashbook.js"></script>
  <script src="js/my-ledger.js"></script>
  <script src="js/employee-ledger.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/whatsapp-hub.js"></script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('✅ SW registered'))
        .catch(err => console.log('❌ SW failed:', err));
    }
  </script>
  <!-- PWA Install Button -->
  <div id="pwa-install-bar" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99999;background:#6C5CE0;color:white;padding:14px 28px;border-radius:50px;font-size:15px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,0.3);cursor:pointer;align-items:center;gap:10px;font-family:sans-serif;">
    📲 Install App
  </div>

  <script>
    let deferredPrompt;

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById("pwa-install-bar");
      btn.style.display = "flex";
      console.log("✅ Install prompt ready");
    });

    document.getElementById("pwa-install-bar").addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log("User choice:", outcome);
      deferredPrompt = null;
      document.getElementById("pwa-install-bar").style.display = "none";
    });

    window.addEventListener("appinstalled", () => {
      console.log("✅ PWA Installed!");
      document.getElementById("pwa-install-bar").style.display = "none";
    });
  </script>
</body>
</html>
